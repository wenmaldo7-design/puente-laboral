schema: spec-driven

context: |
  Tech stack: Angular v22 (Frontend), NestJS v11 (Backend), TailwindCSS v4, Prisma, PostgreSQL
  Architecture: Monorepo with separated `frontend` and `backend` directories
  Testing: Vitest / Karma (Frontend), Jest / Supertest (Backend)
  Style: Prettier, ESLint (Backend)

testing:
  strict_tdd: true
  runner:
    frontend: vitest (or ng test)
    backend: jest

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document UI state changes (Frontend) and API endpoints/schema changes (Backend)
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns and monorepo structure
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
