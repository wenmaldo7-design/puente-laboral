<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Publicar Mentoría</h1>
  
  <form [formGroup]="mentoriaForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 max-w-lg">
    
    <div>
      <label class="block text-sm font-medium">Título</label>
      <input type="text" formControlName="titulo" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block text-sm font-medium">Descripción</label>
      <textarea formControlName="descripcion" class="w-full border rounded p-2"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium">Requisitos</label>
      <textarea formControlName="requisitos" class="w-full border rounded p-2"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium">Duración (minutos)</label>
      <input type="number" formControlName="duracion_minutos" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block text-sm font-medium">ID Área</label>
      <input type="number" formControlName="id_area" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block text-sm font-medium">Fecha</label>
      <input type="date" formControlName="fecha" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block text-sm font-medium">Hora Inicio (HH:mm)</label>
      <input type="time" formControlName="hora_inicio" class="w-full border rounded p-2" />
    </div>

    <div>
      <label class="block text-sm font-medium">Modalidad</label>
      <select formControlName="modalidad" class="w-full border rounded p-2">
        <option value="virtual">Virtual</option>
        <option value="presencial">Presencial</option>
        <option value="hibrida">Híbrida</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium">Link o Canal</label>
      <input type="text" formControlName="link_o_canal" class="w-full border rounded p-2" />
    </div>

    <button type="submit" [disabled]="mentoriaForm.invalid" class="bg-blue-600 text-white p-2 rounded disabled:bg-gray-400">
      Publicar Mentoría
    </button>
  </form>
</div>
